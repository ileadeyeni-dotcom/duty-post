<style>
/* Layout: one narrow column for guards (thumb-first), tabbed console for admin. Navy ink + signal orange. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --sunk:#E3E8EE; --ink:#142033; --muted:#5B6676; --line:#D3DAE2;
  --accent:#D9480F; --accent-ink:#FFFFFF; --navy:#142033; --navy-ink:#F2F5F8;
  --ok:#2B8A3E; --ok-bg:#E3F3E6; --warn:#B35C00; --warn-bg:#FFF0D9; --bad:#C92A2A; --bad-bg:#FDE4E4;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D141E; --surface:#16202E; --sunk:#1D2939; --ink:#E6EBF1; --muted:#93A0B2; --line:#28364A;
  --accent:#FF7A33; --accent-ink:#1A0B02; --navy:#0A1018; --navy-ink:#E6EBF1;
  --ok:#5FD47A; --ok-bg:#163222; --warn:#FFB347; --warn-bg:#3A2A10; --bad:#FF7070; --bad-bg:#3D1717;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D141E; --surface:#16202E; --sunk:#1D2939; --ink:#E6EBF1; --muted:#93A0B2; --line:#28364A;
  --accent:#FF7A33; --accent-ink:#1A0B02; --navy:#0A1018; --navy-ink:#E6EBF1;
  --ok:#5FD47A; --ok-bg:#163222; --warn:#FFB347; --warn-bg:#3A2A10; --bad:#FF7070; --bad-bg:#3D1717;
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:var(--navy-ink);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{font-family:var(--f-display);font-weight:700;font-size:15px;background:var(--accent);color:#fff;padding:3px 7px;border-radius:5px;letter-spacing:.04em}
.brand b{flex:none}
@media (max-width:520px){.brand .client{display:none}}
.brand .client{opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.login-hero .client-line{font-weight:600;opacity:.9;margin-top:4px}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .link{background:none;border:0;color:var(--navy-ink);opacity:.8;font-size:13px;cursor:pointer;padding:6px}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 50px);z-index:19;background:var(--navy);display:flex;gap:2px;overflow-x:auto;
  padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));scrollbar-width:none}
.tabs button{background:none;border:0;color:var(--navy-ink);opacity:.65;padding:10px 12px 12px;font-weight:600;font-size:14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-current="true"]{opacity:1;border-bottom-color:var(--accent)}
.demo-bar .link{border:0;background:none;cursor:pointer;font:inherit}
.row.wrapit > h2{white-space:nowrap;flex:1 0 auto}
.demo-bar{background:var(--warn-bg);color:var(--warn);font-size:12.5px;font-weight:600;text-align:center;padding:6px 16px}

.wrap{max-width:980px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.narrow{max-width:520px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row.wrapit{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:grid;gap:10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.dark{background:var(--navy);color:var(--navy-ink)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13.5px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.tabs button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.big{font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:.03em;min-height:84px;border-radius:16px;text-transform:uppercase}
.big.out{background:transparent;color:var(--bad);border:2px solid var(--bad);font-size:22px;min-height:60px}

/* forms */
label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:5px}
.req{color:var(--accent)}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 12px;min-height:44px}
textarea{min-height:70px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.fgrid .full{grid-column:1/-1}
fieldset{border:0;margin:0;padding:0;display:grid;gap:12px}
legend{font-family:var(--f-display);font-size:20px;font-weight:700;margin-bottom:10px;padding:0}
.imgpick{display:flex;align-items:center;gap:12px}
.imgpick img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.err{background:var(--bad-bg);color:var(--bad);border-radius:9px;padding:10px 12px;font-size:14px;overflow-wrap:anywhere}
.err a{color:inherit}
.note{background:var(--sunk);border-radius:9px;padding:10px 12px;font-size:13.5px;color:var(--muted)}

/* id card */
.idcard{display:flex;gap:14px;align-items:center}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--muted)}
.av.lg{width:96px;height:96px;font-size:34px;border-radius:14px}
.av.sm{width:40px;height:40px;font-size:15px}

/* clock */
.clock{display:grid;gap:14px;text-align:center}
.ringwrap{position:relative;width:220px;height:220px;margin:4px auto}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .mid{position:absolute;inset:0;display:grid;place-content:center;gap:2px}
.cd{font-family:var(--f-mono);font-size:34px;font-variant-numeric:tabular-nums}
.state-pill{justify-self:center}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.due{background:var(--warn-bg);color:var(--warn)}
.chip.late{background:var(--bad-bg);color:var(--bad)} .chip.off{background:var(--sunk);color:var(--muted)}

/* lists */
.list{display:grid}
.item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item.tap{cursor:pointer}
.item .meta{flex:1;min-width:0}
.item .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stripe{width:4px;align-self:stretch;border-radius:2px;flex:none}
.stripe.ok{background:var(--ok)} .stripe.due{background:var(--warn)} .stripe.late{background:var(--bad)} .stripe.off{background:var(--line)}
.ev{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
.ev:first-child{border-top:0}
.ev .t{font-family:var(--f-mono);width:78px;flex:none;white-space:nowrap}
.ev a{color:var(--accent)}

/* summary strip */
.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tally div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tally b{display:block;font-family:var(--f-display);font-size:32px;line-height:1}
.tally .late b{color:var(--bad)} .tally .due b{color:var(--warn)} .tally .ok b{color:var(--ok)}
@media (max-width:460px){.tally{grid-template-columns:repeat(2,1fr)}}

.shiftcard{display:grid;gap:8px}
.flags{display:flex;gap:6px;flex-wrap:wrap}
.evchips{display:flex;flex-wrap:wrap;gap:6px}
.evchip{font-family:var(--f-mono);font-size:12.5px;background:var(--sunk);border:0;border-radius:7px;padding:5px 8px;cursor:pointer;color:var(--ink)}
.evchip.in{background:var(--ok-bg);color:var(--ok)} .evchip.out{background:var(--bad-bg);color:var(--bad)}

.kv{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.docs{display:flex;gap:10px;flex-wrap:wrap}
.docs img{width:120px;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(8,12,18,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:92vh;overflow:auto;display:grid;gap:14px}
@media (min-width:600px){.modal{align-items:center}.sheet{border-radius:18px}}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;min-height:0;opacity:0;cursor:pointer;padding:0;border:0}
#cam{transform:scaleX(-1)}
.selfie-prev{width:100%;max-height:300px;object-fit:contain;border-radius:12px;background:var(--sunk)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.pay{border-collapse:collapse;width:100%;min-width:920px;font-size:14px}
table.pay th,table.pay td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle;white-space:nowrap}
table.pay th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
table.pay th:first-child,table.pay td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;box-shadow:1px 0 0 var(--line)}
table.pay th:first-child{background:var(--sunk)}
table.pay td{font-variant-numeric:tabular-nums}
table.pay tfoot td{font-weight:700;border-bottom:0;background:var(--sunk)}
table.pay .net{font-weight:700}
table.pay .bad{color:var(--bad)}
@media (min-width:980px){.swipe{display:none}}
.cellin{width:78px;min-height:34px;padding:5px 7px;text-align:right;font-variant-numeric:tabular-nums;border-radius:7px}
.sub{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
details.rules summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.rules summary::-webkit-details-marker{display:none}
details.rules summary::after{content:"+";margin-left:auto;font-size:20px;color:var(--muted)}
details.rules[open] summary::after{content:"–"}
.check{display:flex;align-items:center;gap:10px;font-weight:500;color:var(--ink);font-size:14px}
.check input{width:20px;min-height:20px;height:20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--navy-ink);padding:11px 18px;border-radius:10px;z-index:60;font-weight:600;max-width:90vw}
.center{display:grid;place-items:center;min-height:60vh;text-align:center}
.login-hero{background:var(--navy);color:var(--navy-ink);padding:calc(env(safe-area-inset-top,0px) + 40px) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.login-hero h1{font-size:40px;max-width:520px;margin:10px auto 0}
.login-hero p{max-width:520px;margin:8px auto 0;opacity:.75}
.login-hero .in{max-width:520px;margin:0 auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* =========================================================

   data stored only on this phone.

const FIREBASE_CONFIG = {

const FIREBASE_CONFIG = {
  apiKey: "AIza...", authDomain: "may23-guards.firebaseapp.com",
  projectId: "may23-guards", appId: "1:123:web:abc"

*/
const COMPANY = "May23 Security Services Ltd";
const LOGIN_DOMAIN = "may23.dutypost.app";   // guards sign in with Staff ID; this is only used internally
const CHECK_INTERVAL = 2 * 60 * 60 * 1000;           // 2 hours between check-ins
const GRACE = 15 * 60 * 1000;                        // 15 min grace before "Overdue"
const SHIFTS = { day:{label:"Day · 07:00–19:00",start:"07:00",end:"19:00"}, night:{label:"Night · 19:00–07:00",start:"19:00",end:"07:00"} };
const NOW = "__NOW__";

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const fmtT = ms => ms ? new Date(ms).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}) : "—";
const fmtD = ms => ms ? new Date(ms).toLocaleDateString([], {weekday:"short", day:"numeric", month:"short"}) : "—";
const fmtDur = ms => { const m = Math.round(Math.abs(ms) / 60000), h = Math.floor(m / 60); return h ? `${h}h ${pad(m % 60)}m` : `${m}m`; };
const hms = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`; };
const dayStart = d => { const x = new Date(d); x.setHours(0,0,0,0); return x.getTime(); };
const isoDay = ms => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const mapsUrl = (lat, lng) => `https://www.google.com/maps?q=${lat},${lng}`;
const toEmail = id => id.includes("@") ? id.trim() : id.trim().toLowerCase().replace(/[^a-z0-9._-]/g, "") + "@" + LOGIN_DOMAIN;
const initials = n => (n || "?").split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0].toUpperCase()).join("");
const avatar = (g, cls = "") => g?.photo ? `<img class="av ${cls}" src="${g.photo}" alt="">` : `<div class="av ${cls}" aria-hidden="true">${esc(initials(g?.name))}</div>`;
const linkify = s => esc(s).replace(/(https:\/\/[^\s)]+)/g, '<a href="$1" target="_blank" rel="noopener">open this link</a>');
const toast = msg => { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2800); };
async function saveFile(name, blob){
  try {
    const d = window.claude && typeof window.claude.use === "function" ? await window.claude.use("downloads") : null;
    if (d){ await d.save({filename:name, data:blob}); toast("Saved " + name); return; }
  } catch (e) { if (e && e.code === "declined") return; if (e && e.code && !["unavailable","not_granted","capability_disabled","capability_removed"].includes(e.code)) { toast("Couldn't save the file: " + (e.message || e.code)); return; } }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 8000);
}
function errMsg(e){
  const c = e?.code || "";
  if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found")) return "Wrong Staff ID or PIN.";
  if (c.includes("email-already-in-use")) return "That Staff ID or email already has a login.";
  if (c.includes("weak-password")) return "PIN must be at least 6 digits.";
  if (c.includes("permission-denied")) return "You don't have permission for this. Ask the admin to check your account.";
  if (c.includes("network") || c.includes("unavailable")) return "No internet connection. Try again when you have network.";
  return e?.message || String(e);
}

async function compress(file, max, q = 0.7, stamp){
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("Could not read that image.")); i.src = url; });
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  const x = c.getContext("2d"); x.drawImage(img, 0, 0, c.width, c.height);
  if (stamp){ const h = Math.max(18, Math.round(c.height * .07)); x.fillStyle = "rgba(0,0,0,.6)"; x.fillRect(0, c.height - h, c.width, h);
    x.fillStyle = "#fff"; x.font = `${Math.round(h*.55)}px monospace`; x.fillText(stamp, 6, c.height - h*.3); }
  URL.revokeObjectURL(url);
  return c.toDataURL("image/jpeg", q);
}
function getLocation(){
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error("This phone can't share location."));
    navigator.geolocation.getCurrentPosition(
      p => res({lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6), acc:Math.round(p.coords.accuracy)}),
      e => rej(new Error(e.code === 1 ? "Location is blocked. Allow location for this app in your phone settings, then try again." : "Couldn't get your location. Move to an open area and try again.")),
      {enableHighAccuracy:true, timeout:25000, maximumAge:0});
  });
}
function expectedEnd(startMs, endHHMM){
  if (!endHHMM) return null;
  const [h, m] = endHHMM.split(":").map(Number), d = new Date(startMs); d.setHours(h, m, 0, 0);
  if (d.getTime() <= startMs) d.setDate(d.getDate() + 1);
  return d.getTime();
}
function guardStatus(sh, now){
  if (!sh?.active) return {key:"off", label:"Off duty"};
  const due = (sh.lastCheckAt || sh.startedAt) + CHECK_INTERVAL;
  if (now < due) return {key:"ok", label:"On post", due};
  if (now < due + GRACE) return {key:"due", label:"Check-in due", due};
  return {key:"late", label:"Overdue", due};
}
function missedChecks(times, endMs){ // times: sorted ms of in + checks
  let missed = 0; const all = [...times, endMs];
  for (let i = 1; i < all.length; i++){ const gap = all[i] - all[i-1]; if (gap > CHECK_INTERVAL + GRACE) missed += Math.floor((gap - GRACE) / CHECK_INTERVAL); }
  return missed;

async function makeFirebase(cfg){
  const B = "https://www.gstatic.com/firebasejs/10.12.2/";
  const [AP, A, F] = await Promise.all([import(B+"firebase-app.js"), import(B+"firebase-auth.js"), import(B+"firebase-firestore.js")]);
  const app = AP.initializeApp(cfg), auth = A.getAuth(app), db = F.getFirestore(app);
  const norm = s => { const o = {id:s.id, ...s.data()}; for (const k in o) if (o[k]?.toMillis) o[k] = o[k].toMillis(); return o; };
  return {
    demo:false,
    onAuth: cb => A.onAuthStateChanged(auth, u => cb(u ? {uid:u.uid, email:u.email} : null)),
    signIn: (id, pin) => A.signInWithEmailAndPassword(auth, toEmail(id), pin),
    signOut: () => A.signOut(auth),
    async firstAdmin(name, email, pw){
      const c = await A.createUserWithEmailAndPassword(auth, email.trim(), pw);
      const b = F.writeBatch(db);
      b.set(F.doc(db, "users", c.user.uid), {role:"admin", name, loginId:email.trim(), createdAt:F.serverTimestamp()});
      b.set(F.doc(db, "config", "setup"), {by:c.user.uid, at:F.serverTimestamp()});
      await b.commit();
    },
    async createAccount(loginId, pin){ // uses a second app so the admin stays signed in
      const sec = AP.initializeApp(cfg, "sec" + Date.now()), sa = A.getAuth(sec);
      try { const c = await A.createUserWithEmailAndPassword(sa, toEmail(loginId), pin); return c.user.uid; }
      finally { await A.signOut(sa).catch(()=>{}); await AP.deleteApp(sec).catch(()=>{}); }
    },
    async get(col, id){ const s = await F.getDoc(F.doc(db, col, id)); return s.exists() ? norm(s) : null; },
    set: (col, id, data, o = {}) => F.setDoc(F.doc(db, col, id), data, {merge:!o.replace}),
    async add(col, data){ const r = await F.addDoc(F.collection(db, col), data); return r.id; },
    async list(col, {siteId, from, to, where} = {}){
      const c = [];
      if (siteId) c.push(F.where("siteId", "==", siteId));
      if (where) c.push(F.where(where[0], "==", where[1]));
      if (from != null) c.push(F.where("ts", ">=", F.Timestamp.fromMillis(from)), F.where("ts", "<", F.Timestamp.fromMillis(to)), F.orderBy("ts"));
      const s = await F.getDocs(F.query(F.collection(db, col), ...c)); return s.docs.map(norm);
    },
    watch(col, {siteId} = {}, cb){   // live updates: only changed documents are read again
      const c = siteId ? [F.where("siteId", "==", siteId)] : [];
      return F.onSnapshot(F.query(F.collection(db, col), ...c), snap => cb(snap.docs.map(norm)), err => cb(null, err));
    },
    async clock(uid, ev, selfie, patch){
      const S = F.serverTimestamp(), b = F.writeBatch(db);
      const cref = F.doc(F.collection(db, "clocks")), sref = F.doc(F.collection(db, "selfies"));
      b.set(sref, {guardUid:uid, siteId:ev.siteId, img:selfie, clockId:cref.id});
      b.set(cref, {...ev, guardUid:uid, selfieId:sref.id, ts:S});
      const p = {}; for (const [k, v] of Object.entries(patch)) p[k] = v === NOW ? S : v;
      b.set(F.doc(db, "shifts", uid), p, {merge:true});
      await b.commit();
    }
  };
}

    try { const stamp = `${st.guard.staffId} ${new Date().toLocaleString()}`; img = await compress(src, 360, 0.6, stamp);
      const p = $("#sPrev"); p.src = img; p.hidden = false; $("#camBox").hidden = true; $("#fileBox").hidden = true; $("#retake").hidden = false; showErr(""); upd(); }
    catch (x) { showErr(x.message); }
  };
  const startCam = async () => {
    $("#sPrev").hidden = true; $("#retake").hidden = true;
    try {
      if (!navigator.mediaDevices?.getUserMedia) throw new Error("no camera api");
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user", width:{ideal:720}}, audio:false});
      const v = $("#cam"); v.srcObject = stream; await v.play().catch(() => {});
      $("#camBox").hidden = false; $("#fileBox").hidden = true;
    } catch { stopCam(); $("#camBox").hidden = true; $("#fileBox").hidden = false; }
  };
  startCam();
  $("#snap").addEventListener("click", async () => {
    const v = $("#cam"); if (!v.videoWidth) { showErr("Camera is still starting. Wait a second and try again."); return; }
    const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight; c.getContext("2d").drawImage(v, 0, 0);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.9)); stopCam(); setImg(blob);
  });
  $("#sIn").addEventListener("change", e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    if (f.lastModified && Date.now() - f.lastModified > 10 * 60 * 1000) { showErr("Please take a new selfie now. Old photos from the gallery are not accepted."); return; }
    setImg(f);
  });
  $("#retake").addEventListener("click", () => { img = null; upd(); startCam(); });
  $("#sampleSelfie")?.addEventListener("click", async () => {
    stopCam(); const c = document.createElement("canvas"); c.width = 360; c.height = 360; const x = c.getContext("2d");
    x.fillStyle = "#8aa1b8"; x.fillRect(0, 0, 360, 360); x.fillStyle = "#e9eef3"; x.beginPath(); x.arc(180, 140, 62, 0, 7); x.fill(); x.beginPath(); x.ellipse(180, 330, 120, 100, 0, 0, 7); x.fill();
    x.fillStyle = "#142033"; x.font = "bold 20px sans-serif"; x.textAlign = "center"; x.fillText("SAMPLE SELFIE", 180, 30);
    setImg(await new Promise(r => c.toBlob(r, "image/jpeg", 0.9)));
  });
  $("#cGo").addEventListener("click", async () => {
    const b = $("#cGo"); b.disabled = true; b.textContent = "Saving…";
    try { await submitClock(type, loc, img); closeModal(); toast(type === "in" ? "Clocked in. Next check-in in 2 hours." : type === "out" ? "Clocked out. Well done today." : "Check-in recorded."); await loadGuard(); }
    catch (x) { showErr(errMsg(x)); b.disabled = false; b.textContent = "Try again"; }
  });
}
async function submitClock(type, loc, img){
  const uid = st.user.uid, g = st.guard, sh = st.shift || {}, t = Date.now();
  const shiftId = type === "in" ? `${uid}-${t}` : sh.shiftId;
  const ev = {type, guardName:g.name, staffId:g.staffId, siteId:g.siteId || "", shiftId, lat:loc.lat, lng:loc.lng, acc:loc.acc, clientTs:t};
  const e = {type, ts:t, lat:loc.lat, lng:loc.lng};
  let patch;
  if (type === "in") patch = {active:true, shiftId, siteId:ev.siteId, guardName:g.name, staffId:g.staffId, startedAt:NOW, lastCheckAt:NOW, endedAt:null, earlyMins:0, events:[e]};
  else if (type === "check") patch = {lastCheckAt:NOW, events:[...(sh.events || []), e]};
  else {
    const end = expectedEnd(sh.startedAt, g.shiftEnd), early = end && t < end ? Math.round((end - t) / 60000) : 0;
    ev.earlyMins = early; patch = {active:false, endedAt:NOW, earlyMins:early, events:[...(sh.events || []), e]};
  }
  await BE.clock(uid, ev, img, patch);
}

/* ---------- payroll (admin) ---------- */
const PAY_DEFAULTS = {expectedDays:26, missedFine:500, earlyDeduct:true, noOutRule:"half", narration:"May23 salary {month}"};
const NO_OUT_RULES = {full:"Pay the full day", half:"Pay half the day", none:"Don't pay that day"};
const num = v => { const x = parseFloat(String(v == null ? "" : v).replace(/[^0-9.]/g, "")); return isFinite(x) ? x : 0; };
const r2 = v => Math.round(v * 100) / 100;
const naira = v => { const x = r2(v); return "₦" + x.toLocaleString("en-NG", {minimumFractionDigits:Number.isInteger(x) ? 0 : 2, maximumFractionDigits:2}); };
const monthRange = ym => { const [y, m] = ym.split("-").map(Number); return [new Date(y, m - 1, 1).getTime(), new Date(y, m, 1).getTime()]; };
const monthLabel = ym => { const [y, m] = ym.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString("en-GB", {month:"long", year:"numeric"}); };
function shiftHours(g){
  if (!g.shiftStart || !g.shiftEnd) return 12;
  const [a, b] = g.shiftStart.split(":").map(Number), [c, d] = g.shiftEnd.split(":").map(Number);
  let m = (c * 60 + d) - (a * 60 + b); if (m <= 0) m += 1440; return m / 60;
}
/* Pure calculation: one row per guard for month `ym`, from their clock events. */
function computePayroll(guards, pays, clocks, set, ym, edits, now){
  const [from, to] = monthRange(ym), byG = {};
  for (const c of clocks){ const g = byG[c.guardUid] || (byG[c.guardUid] = {}); (g[c.shiftId] || (g[c.shiftId] = [])).push(c); }
  return guards.map(g => {
    const p = pays[g.id] || {}, e = edits[g.id] || {}, hrs = shiftHours(g), days = new Set();
    let missed = 0, earlyMins = 0, noOut = 0;
    for (const raw of Object.values(byG[g.id] || {})){
      const evs = raw.slice().sort((a, b) => a.ts - b.ts), first = evs[0];
      if (first.type !== "in" || first.ts < from || first.ts >= to) continue;   // shift must start inside the month
      days.add(isoDay(first.ts));
      const out = evs.find(x => x.type === "out"), times = evs.filter(x => x.type !== "out").map(x => x.ts);
      const end = out ? out.ts : Math.min(now, expectedEnd(first.ts, g.shiftEnd) || first.ts + hrs * 3600e3);
      missed += missedChecks(times, end);
      if (out) earlyMins += out.earlyMins || 0; else if (end < now) noOut++;
    }
    const daily = p.payType === "Daily rate", expected = num(set.expectedDays) || 26, worked = days.size;
    const rate = daily ? num(p.dailyRate) : num(p.salary) / expected;
    const noOutLoss = set.noOutRule === "half" ? noOut * 0.5 : set.noOutRule === "none" ? noOut : 0;
    const daysPaid = Math.max(0, e.days !== undefined && e.days !== "" ? num(e.days) : worked - noOutLoss);
    const base = daily ? rate * daysPaid : Math.min(num(p.salary), rate * daysPaid);
    const missedDed = missed * num(set.missedFine), earlyDed = set.earlyDeduct ? (rate / hrs) * (earlyMins / 60) : 0;
    const bonus = num(e.bonus), other = num(e.other);
    const net = Math.max(0, r2(base + bonus - missedDed - earlyDed - other));
    const acct = String(p.accountNumber || "");
    return {uid:g.id, name:g.name, staffId:g.staffId, siteId:g.siteId, status:g.status || "Active", payType:daily ? "Daily rate" : "Monthly salary",
      salary:num(p.salary), rate:r2(rate), expected, worked, daysPaid, overridden:e.days !== undefined && e.days !== "", absent:Math.max(0, expected - worked),
      missed, earlyMins, noOut, base:r2(base), missedDed:r2(missedDed), earlyDed:r2(earlyDed), bonus, other, net,
      bank:p.bank || "", accountNumber:acct, accountName:p.accountName || "", sortCode:p.sortCode || "",
      hasRate:rate > 0, bankOk:/^\d{10}$/.test(acct) && !!p.bank && !!p.accountName, edit:e};
  });
}

async function loadPayData(ym){

    BE.list("clocks", {from, to:to + 14 * 3600e3})]);   // +14h catches night shifts ending after midnight
  st.payData = {ym, guards, pays:Object.fromEntries(pays.map(p => [p.id, p])), set:{...PAY_DEFAULTS, ...(setDoc || {})}, run, clocks};
  st.payEdits = st.payEdits || {};

}

async function exportPayroll(btn){

      [], [...Array(12).fill(""), "Totals", ...["base","missedDed","earlyDed","other","bonus","net"].map(k => r2(rows.reduce((s, r) => s + r[k], 0)))]]);
    fmt(s2, [4, 5, 13, 14, 15, 16, 17, 18], 1);
    s2["!cols"] = head.map((h, i) => ({wch:[10,24,20,14][i] || Math.max(11, Math.min(h.length + 2, 22))}));

      ["Guards missing bank details", rows.filter(r => !r.bankOk && r.net > 0).length], ["Total deductions", r2(rows.reduce((s, r) => s + r.missedDed + r.earlyDed + r.other, 0))],

      ["Shift with no clock-out", NO_OUT_RULES[set.noOutRule] || set.noOutRule], [], ["Prepared by", st.profile?.name || ""], ["Approved by", ""], ["Signature / date", ""]]);

        <div><label for="sa">Address</label><input id="sa" placeholder="Street, town"></div><div class="full"><button class="btn sm" type="submit">Add site</button></div></form></section>
    <section class="card stack"><h3 style="font-size:20px">Supervisors</h3><p class="small muted" style="margin:0">Supervisors see the guards, live board and attendance for their own site only.</p>
      <div class="list">${sups.map(u => `<div class="item"><div class="meta"><b>${esc(u.name)}</b><span class="small muted">Login: <span class="mono">${esc(u.loginId)}</span> · ${esc(siteName(u.siteId))}</span></div></div>`).join("") || `<p class="muted" style="margin:0">No supervisors yet.</p>`}</div>
      <form id="supForm" class="fgrid"><div><label for="un">Full name</label><input id="un" required></div>
        <div><label for="ul">Login ID</label><input id="ul" required placeholder="e.g. SUP-01"></div>
        <div><label for="up">6-digit PIN</label><input id="up" class="mono" inputmode="numeric" maxlength="6" required></div>
        <div><label for="us">Site</label><select id="us" required><option value="">Choose site</option>${st.sites.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></div>
        <div class="full"><div class="err" id="supErr" hidden></div><button class="btn sm" type="submit">Add supervisor</button></div></form></section>
    <section class="card stack"><h3 style="font-size:20px">Install link for guards</h3>
      <p class="small muted" style="margin:0">Send this link to each guard. On Android, open it in Chrome and tap <b>Install app</b>. On iPhone, open it in Safari, tap Share, then <b>Add to Home Screen</b>.</p>
      <div class="row"><input readonly value="${esc(location.href.split("#")[0])}" id="shareUrl" class="mono small"><button class="btn ghost sm" data-act="copy">Copy</button></div></section>`;
  $("#siteForm").addEventListener("submit", async e => { e.preventDefault(); await BE.add("sites", {name:$("#sn").value.trim(), address:$("#sa").value.trim()}); toast("Site added"); loadAdmin(); });
  $("#supForm").addEventListener("submit", async e => {
    e.preventDefault(); const pin = $("#up").value.trim(), er = $("#supErr");
    if (!/^\d{6}$/.test(pin)) { er.textContent = "PIN must be exactly 6 digits."; er.hidden = false; return; }
    if (!$("#us").value) { er.textContent = "Choose a site."; er.hidden = false; return; }
    try { const uid = await BE.createAccount($("#ul").value, pin); await BE.set("users", uid, {role:"supervisor", name:$("#un").value.trim(), loginId:$("#ul").value.trim(), siteId:$("#us").value}); toast("Supervisor added"); loadAdmin(); }
    catch (x) { er.textContent = errMsg(x); er.hidden = false; }
  });
}

/* ---------- events ---------- */
function stopTimers(){ clearInterval(timer); clearInterval(liveTimer); timer = liveTimer = null; if (st.unwatch){ try { st.unwatch(); } catch {} st.unwatch = null; } }
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act;
  if (a === "signout"){ stopTimers(); await BE.signOut(); }
  else if (a === "reset-demo") BE.reset();
  else if (a === "demo-login"){ try { await BE.signIn(t.dataset.id, "123456"); } catch (x) { renderLogin(errMsg(x)); } }
  else if (a === "setup") renderSetup();
  else if (a === "back-login") renderLogin();
  else if (a === "clock") clockFlow(t.dataset.type);
  else if (a === "close") closeModal();
  else if (a === "notif"){ try { const p = await Notification.requestPermission(); toast(p === "granted" ? "Alerts turned on" : "Alerts are blocked in phone settings"); } catch {} renderGuard(); }
  else if (a === "tab"){ st.tab = t.dataset.tab; st.openId = null; if (st.tab === "pay") st.payData = null; renderAdmin(); }
  else if (a === "refresh") renderAdmin();
  else if (a === "open-guard"){ st.openId = t.dataset.id; st.tab = "guard"; renderAdmin(); }
  else if (a === "new-guard"){ st.openId = null; st.tab = "guardForm"; renderAdmin(); }
  else if (a === "edit-guard"){ st.openId = t.dataset.id; st.tab = "guardForm"; renderAdmin(); }
  else if (a === "ev") showEvent(t.dataset.id);
  else if (a === "csv") exportCsv();
  else if (a === "pay-xlsx") exportPayroll(t);
  else if (a === "pay-save") savePayroll();
  else if (a === "pay-refresh"){ st.payData = null; renderAdmin(); }
  else if (a === "copy"){ const i = $("#shareUrl"); try { await navigator.clipboard.writeText(i.value); toast("Link copied"); } catch { i.select(); } }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && st.profile?.role === "guard") tickGuard(); });

/* ---------- boot ---------- */
(async function boot(){
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  try { BE = FIREBASE_CONFIG ? await makeFirebase(FIREBASE_CONFIG) : makeDemo(); }
  catch (e) { app.innerHTML = `<main class="wrap narrow"><div class="err">Couldn't connect. Check your internet and reload. (${esc(e.message)})</div></main>`; return; }
  BE.onAuth(async u => {
    st.user = u; st.profile = null; st.tab = "live"; st.siteFilter = ""; closeModal();
    if (!u) return renderLogin();
    try {
      st.profile = await BE.get("users", u.uid);
      if (!st.profile){ app.innerHTML = shell(`<main class="wrap narrow"><div class="card">This login isn't linked to a staff record yet. Ask the admin to set it up.</div></main>`); return; }
      st.profile.role === "guard" ? await loadGuard() : await loadAdmin();
    } catch (e) { app.innerHTML = shell(`<main class="wrap narrow"><div class="err">${linkify(errMsg(e))}</div></main>`); }
  });
})();
</script>
</body>
</html>
